<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta - ComUp</title><link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><h2 class="hi">Minha conta</h2><p class="mut">Gerencie seus dados, sua paróquia e sua senha.</p><div class="two" id="ct"></div></main><script src="common.js"></script><script>
const kv=(l,v)=>`<div class="kv"><span>${l}</span>${esc(v)}</div>`;
const edita=(t,ks)=>modal(t,CAD.filter(f=>ks.includes(f[0])),me,async o=>{me=(await api('me','PUT',{...me,...o})).user;closeM();render()});
function render(){$('ct').innerHTML=`<div class="card"><h3>Paróquia</h3>${kv('Paróquia',me.paroquia)}${kv('Diocese',me.diocese)}${kv('Cargo',me.cargo)}<button class="btn pri" onclick="edita('Mudar de paróquia',['paroquia','diocese','cargo'])">Mudar de paróquia</button></div>
<div class="card"><h3>Dados pessoais</h3>${kv('Nome completo',me.nome)}${kv('Telefone',me.telefone)}${kv('E-mail',me.email)}<button class="btn" onclick="edita('Editar dados pessoais',['nome','telefone'])">Editar dados</button></div>
<div class="card"><h3>Segurança</h3><p>Troque sua senha ou encerre a sessão neste aparelho.</p><div class="acts" style="margin-top:14px"><button class="btn" onclick="senha()">Alterar senha</button><button class="btn" onclick="sair()">Sair da conta</button></div></div>`}
(async()=>{if(await shell('conta'))render()})();</script></body></html>
